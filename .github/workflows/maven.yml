name: UI Automation (Maven + Allure)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to run"
        required: true
        default: "main"
        
      environment:
        description: "Environment (qa/stage/prod)"
        required: true
        default: "qa"
        
      browser:
        description: "Browser (headless/chrome)"
        required: true
        default: "headless"
        
      suite:
        description: "TestNG suite file"
        required: true
        default: "suites/testng.xml"

jobs:
  automation-test:
    name: Automation Test UI/API UIBreaker
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Java
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Cache Maven
      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven

      # 4. Install Chrome
      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      # 5. Install ChromeDriver
      - name: Install ChromeDriver
        uses: nanasess/setup-chromedriver@v2

      # 6. Run TestNG tests
      - name: Run TestNG tests
        run: |
            mvn test \
              -Denv=${{ github.event.inputs.environment }} \
              -Dbrowser=${{ github.event.inputs.browser }} \
              -DsuiteXml=${{ github.event.inputs.suite }}

      # 7. Upload Allure Results
      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: target/allure-results

      # 8. Install Allure CLI
      - name: Install Allure
        run: |
          wget https://repo.maven.apache.org/maven2/io/qameta/allure/allure-commandline/2.29.0/allure-commandline-2.29.0.zip
          unzip allure-commandline-2.29.0.zip
          sudo mv allure-2.29.0 /opt/allure
          sudo ln -s /opt/allure/bin/allure /usr/bin/allure

      # 9. Generate Allure Report
      - name: Generate Allure Report
        run: |
          allure generate target/allure-results --clean -o target/allure-report --single-file

      # 10. Upload Allure Report
      - name: Upload Allure Report
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: target/allure-report
